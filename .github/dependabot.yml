version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
